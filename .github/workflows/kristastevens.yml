name: Record TikTok Live - Krista Stevens

on:
  repository_dispatch:
    types: [trigger-tiktok-1]
  workflow_dispatch:

concurrency:
  group: tiktok-1-recording
  cancel-in-progress: false

jobs:
  record_and_send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip curl
          pip3 install --upgrade yt-dlp

      - name: Record TikTok Live
        run: |
          URL="https://www.tiktok.com/@kristastevens/live"

          echo "Comprobando transmisión de TikTok..."
          yt-dlp "$URL" -o raw_video.mp4 \
            --no-part \
            --hls-use-mpegts \
            --retries infinite \
            --fragment-retries infinite || true

      - name: Split and Send Video via Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f raw_video.mp4 ] && [ $(stat -c%s "raw_video.mp4") -gt 10000000 ]; then
            echo "Procesando y dividiendo video en segmentos limpios..."
            ffmpeg -fflags +genpts -i raw_video.mp4 -c:v libx264 -preset ultrafast -crf 28 -c:a aac -f segment -segment_time 300 -reset_timestamps 1 output_%03d.mp4

            for file in output_*.mp4; do
              if [ -f "$file" ]; then
                echo "Enviando $file a Telegram..."
                curl -F chat_id="$CHAT_ID" \
                     -F video="@$file" \
                     -F caption="🔴 Grabación TikTok Live (Krista Stevens) finalizada: $file" \
                     https://api.telegram.org/bot$BOT_TOKEN/sendVideo
                rm "$file"
              fi
            done
            rm raw_video.mp4
          else
            echo "Sin transmisión activa o video corrupto."
          fi
