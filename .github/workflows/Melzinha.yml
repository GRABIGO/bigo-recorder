name: Record Streamer 4

on:
  schedule:
    - cron: '*/5 * * * *'
  repository_dispatch:
    types: [trigger-streamer-4]
  workflow_dispatch:

concurrency:
  group: streamer-4-recording
  cancel-in-progress: true

jobs:
  record_and_send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip curl
          pip3 install --upgrade streamlink

      - name: Record Live Stream
        run: |
          URL="https://www.bigo.tv/user/Eu_Mel"

          echo "Comprobando transmisión..."
          streamlink --http-header "User-Agent=Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/120.0.0.0 Safari/537.36" \
            --http-header "Referer=https://www.bigo.tv/" \
            "$URL" best -o raw_video.mp4 \
            --retry-streams 10 \
            --retry-max 20 \
            --retry-open 10 \
            --hls-live-restart \
            --stream-segment-threads 2 \
            --stream-segment-timeout 60 \
            --stream-timeout 60 || true

      - name: Split and Send Video via Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f raw_video.mp4 ] && [ $(stat -c%s "raw_video.mp4") -gt 10000000 ]; then
            echo "Procesando y dividiendo video en segmentos limpios..."
            ffmpeg -fflags +genpts -i raw_video.mp4 -c:v libx264 -preset ultrafast -crf 28 -c:a aac -f segment -segment_time 300 -reset_timestamps 1 output_%03d.mp4

            for file in output_*.mp4; do
              if [ -f "$file" ]; then
                echo "Enviando $file a Telegram..."
                curl -F chat_id="$CHAT_ID" \
                     -F video="@$file" \
                     -F caption="🔴 Grabación finalizada (Eu_Mel): $file" \
                     https://api.telegram.org/bot$BOT_TOKEN/sendVideo
                rm "$file"
              fi
            done
            rm raw_video.mp4
          else
            echo "Sin transmisión activa o video corrupto."
          fi
