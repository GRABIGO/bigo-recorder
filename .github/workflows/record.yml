name: Record Multiple Bigo Live Streams

on:
  schedule:
    # Se ejecuta automáticamente cada 30 minutos para revisar las salas
    - cron: '*/5 * * * *'
  workflow_dispatch: # Permite ejecutarlo manualmente desde la pestaña Actions cuando quieras

jobs:
  record_and_send:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip curl
          pip3 install --upgrade streamlink

      - name: Record Live Streams
        run: |
          # AGREGA O EDITA LAS URLS DE LAS SALAS AQUÍ (una por línea entre comillas)
          URLS=(
            "https://www.bigo.tv/BA.Rinco"
            "https://www.bigo.tv/shir_dance"
            "https://www.bigo.tv/AZ_WIL"
          )

          for URL in "${URLS[@]}"; do
            echo "------------------------------------------------"
            echo "Comprobando transmisión en: $URL"
            echo "------------------------------------------------"
            
            # Intenta capturar la transmisión
            streamlink "$URL" best -o raw_video.mp4 --retry-streams 3 --retry-max 2 || true

            # Si la sala estaba en vivo y generó un archivo de video
            if [ -f raw_video.mp4 ]; then
              echo "¡Transmisión detectada! Procesando video..."
              
              # Divide el video en partes de 1.9GB si excede el tamaño máximo permitido por Telegram
              ffmpeg -i raw_video.mp4 -c copy -fs 1900M output_%03d.mp4

              # Envía cada fragmento generado por Telegram
              for file in output_*.mp4; do
                if [ -f "$file" ]; then
                  echo "Enviando $file a Telegram..."
                  curl -v -F chat_id="${{ secrets.TELEGRAM_CHAT_ID }}" \
                       -F document=@"$file" \
                       -F caption="🔴 Grabación finalizada de: $URL" \
                       https://api.telegram.org/bot${{ secrets.TELEGRAM_BOT_TOKEN }}/sendDocument
                  
                  # Borra el fragmento enviado para no saturar el disco del servidor
                  rm "$file"
                fi
              done
              
              # Borra el archivo original antes de pasar a la siguiente URL
              rm raw_video.mp4
            else
              echo "La sala no está en transmisión o no se pudo conectar."
            fi
          done
