name: Record Streamer 7

on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

jobs:
  record_and_send:
    runs-on: ubuntu-latest
    concurrency:
      group: streamer-7-recording
      cancel-in-progress: false

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg python3-pip curl
          pip3 install --upgrade streamlink

      - name: Record Live Stream
        run: |
          URL="https://www.bigo.tv/MyShophieB"
          
          echo "Comprobando transmisión..."
          streamlink "$URL" best -o raw_video.mp4 \
            --retry-streams 10 \
            --retry-max 20 \
            --retry-open 10 \
            --stream-segment-timeout 60 \
            --stream-timeout 60 || true

      - name: Split and Send Video via Telegram
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -f raw_video.mp4 ] && [ $(stat -c%s "raw_video.mp4") -gt 10000000 ]; then
            echo "Procesando y dividiendo video..."
            ffmpeg -i raw_video.mp4 -c copy -fs 1900M output_%03d.mp4
            
            for file in output_*.mp4; do
              if [ -f "$file" ]; then
                echo "Enviando $file a Telegram..."
                curl -v -F chat_id="$CHAT_ID" \
                     -F document=@"$file" \
                     -F caption="🔴 Grabación Streamer 7 (MyShophieB) finalizada" \
                     https://api.telegram.org/bot$BOT_TOKEN/sendDocument
                rm "$file"
              fi
            done
            rm raw_video.mp4
          else
            echo "Sin transmisión activa o video corrupto."
          fi
